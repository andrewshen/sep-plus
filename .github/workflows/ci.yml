name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Catches manifest and bundling errors that typecheck and tests miss.
      - name: Build
        run: npm run build:chrome && npm run build:firefox

      # Catches APIs and manifest keys Firefox doesn't support.
      - name: Lint Firefox build
        run: npm run lint:firefox
